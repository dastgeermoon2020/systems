services:
  postgres:
    image: postgres:17-alpine
    container_name: chat-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: chatadmin
      POSTGRES_PASSWORD: change_this_password
      POSTGRES_DB: chat_system

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatadmin -d chat_system"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chat-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
